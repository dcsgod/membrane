[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "membrane-memory"
version = "0.1.1"
description = "The programmable memory layer for AI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Membrane Contributors" }]
keywords = ["memory", "ai", "agents", "llm", "rag", "memory-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.20", "python-multipart"]
mcp = ["mcp>=1.0"]
postgres = ["asyncpg>=0.29", "psycopg2-binary>=2.9"]
langchain = ["langchain-core>=0.2"]
langgraph = ["langgraph>=0.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
embeddings-local = ["sentence-transformers>=2.0"]
tokenizers = ["tiktoken>=0.5"]
otel = ["opentelemetry-api>=1.0", "opentelemetry-sdk>=1.0"]
bench = ["hypothesis>=6.0", "pytest-benchmark>=4.0"]
demo = ["fastapi>=0.100", "uvicorn>=0.20", "jinja2>=3.0"]
research = ["torch>=2.0", "scikit-learn>=1.3"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "hatchling",
]
all = [
    "membrane-memory[server,mcp,postgres,embeddings-local,tokenizers,otel,bench,demo]",
]

[project.scripts]
membrane = "membrane.cli.main:app"

[project.urls]
Homepage = "https://pypi.org/project/membrane-memory/"
Documentation = "https://pypi.org/project/membrane-memory/"
Repository = "https://pypi.org/project/membrane-memory/"
"Bug Tracker" = "https://pypi.org/project/membrane-memory/"

[tool.hatch.build.targets.wheel]
packages = ["src/membrane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
